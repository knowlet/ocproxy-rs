[package]
name = "ocproxy-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Unprivileged OpenConnect SOCKS5 and TCP forwarding with a Rust userspace network stack"
license = "MIT"
repository = "https://github.com/knowlet/ocproxy-rs"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
libc = "0.2"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic", "socket-dns", "async", "dns-max-server-count-8", "dns-max-result-count-16", "proto-ipv4-fragmentation", "proto-ipv6-fragmentation", "reassembly-buffer-size-65536", "reassembly-buffer-count-4"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
